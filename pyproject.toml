[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "nadi9-subtitle-agent"
version = "0.1.0"
description = "Evidence-grounded subtitle proposals with explicit uncertainty and correction tracking"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
nadi9 = "nadi9.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nadi9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
